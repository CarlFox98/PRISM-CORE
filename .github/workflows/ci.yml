name: PRISM CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: JS syntax check
        run: |
          for f in core/*.js; do
            echo "checking $f"; node --check "$f"
          done

      - name: Config / scene integrity test
        run: node scripts/test-socials.mjs

      # The shoutout service (and its Python tests) moved to stream-manager in
      # 1.7.2; only PRISM's own scripts are compiled here.
      - name: Python script syntax
        run: python3 -m py_compile scripts/*.py

      - name: Scene sets build (dry run)
        run: python3 scripts/build-obs-set.py --set prism-signal --out /tmp/sets/prism-signal --dry-run && python3 scripts/build-obs-set.py --set prism-soft --out /tmp/sets/prism-soft --dry-run

      - name: Shoutout overlay queue test
        run: node scripts/test-shoutout-overlay.mjs

      # Drives the real chat renderer in a real browser against a scriptable
      # fake Stream Manager. The script skips cleanly when playwright is absent,
      # so chromium is installed here deliberately to make it actually run.
      - name: Chat overlay behaviour test
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          node scripts/test-chat-overlay.mjs

      # Renders each built set's chat-preview and checks it is showing the real
      # overlay. The source guards check the fix is still spelled right; this
      # checks the page still works. Two releases shipped a preview whose files
      # all existed and which had no DOM in common with the overlay.
      - name: Chat preview render test
        run: node scripts/test-chat-preview.mjs

      # The README and CHANGELOG have drifted behind VERSION before. The
      # maintenance service checks this weekly on the streaming PC; doing it
      # here catches it at the commit that caused it.
      - name: VERSION matches the changelog
        run: |
          v=$(tr -d ' \t\r\n' < VERSION)
          echo "VERSION = $v"
          grep -q "\[$v\]" docs/CHANGELOG.md \
            || { echo "docs/CHANGELOG.md has no [$v] entry"; exit 1; }

      - name: Secret scan
        run: bash scripts/scan-secrets.sh
