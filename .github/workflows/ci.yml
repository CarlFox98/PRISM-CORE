name: PRISM CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: JS syntax check
        run: |
          for f in core/prism-config.js core/prism-engine.js; do
            echo "checking $f"; node --check "$f"
          done

      - name: Config / scene integrity test
        run: node scripts/test-socials.mjs

      - name: Python service syntax
        run: |
          python3 -m py_compile prism_shoutout_service.py scripts/*.py
          python3 -m py_compile prism-shoutout/prism_shoutout/*.py

      - name: Shoutout service tests
        run: |
          python3 -m pip install --quiet -r prism-shoutout/requirements.txt
          cd prism-shoutout && python3 -m unittest discover -s tests

      - name: Shoutout overlay queue test
        run: node scripts/test-shoutout-overlay.mjs

      - name: Secret scan
        run: bash scripts/scan-secrets.sh
