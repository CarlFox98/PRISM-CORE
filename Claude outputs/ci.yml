name: PRISM CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: JS syntax check
        run: |
          for f in core/*.js; do
            echo "checking $f"; node --check "$f"
          done

      - name: Config / scene integrity test
        run: node scripts/test-socials.mjs

      # The shoutout service (and its Python tests) moved to stream-manager in
      # 1.7.2; only PRISM's own scripts are compiled here.
      - name: Python script syntax
        run: python3 -m py_compile scripts/*.py

      - name: Scene sets build (dry run)
        run: python3 scripts/build-obs-set.py --set prism-signal --out /tmp/sets/prism-signal --dry-run && python3 scripts/build-obs-set.py --set prism-soft --out /tmp/sets/prism-soft --dry-run

      - name: Shoutout overlay queue test
        run: node scripts/test-shoutout-overlay.mjs

      - name: Secret scan
        run: bash scripts/scan-secrets.sh
