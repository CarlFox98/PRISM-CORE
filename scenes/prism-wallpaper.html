<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PRISM — Game Scene Wallpaper</title>
<link rel="stylesheet" href="../core/prism-theme.css">
<style>
/* ============================================================
   PRISM — Game Scene Wallpaper
   Full-screen ambient background for the moments before a game
   is captured. Add as a Browser Source (1920x1080) at the
   BOTTOM of your Game Scene's layer stack; the game capture
   covers it automatically once the game is up.
   ============================================================ */

/* flowing aurora ribbons (dynamic) */
.aurora{ position:absolute; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
.aurora span{ position:absolute; border-radius:50%; filter:blur(70px); mix-blend-mode:screen; opacity:0.5; }
.aurora .a1{ width:1400px; height:520px; left:-8%; top:10%;
  background:radial-gradient(ellipse, rgba(87,242,228,0.30), transparent 68%);
  animation:rib-1 30s ease-in-out infinite; }
.aurora .a2{ width:1500px; height:560px; right:-10%; top:34%;
  background:radial-gradient(ellipse, rgba(185,131,255,0.28), transparent 68%);
  animation:rib-2 38s ease-in-out infinite; }
.aurora .a3{ width:1300px; height:480px; left:10%; bottom:-4%;
  background:radial-gradient(ellipse, rgba(255,122,203,0.22), transparent 70%);
  animation:rib-3 34s ease-in-out infinite; }
.aurora .a4{ width:1200px; height:460px; right:6%; top:2%;
  background:radial-gradient(ellipse, rgba(108,139,255,0.24), transparent 70%);
  animation:rib-4 44s ease-in-out infinite; }
@keyframes rib-1{ 0%,100%{transform:translate(0,0) rotate(-8deg) scale(1)} 50%{transform:translate(240px,60px) rotate(6deg) scale(1.18)} }
@keyframes rib-2{ 0%,100%{transform:translate(0,0) rotate(10deg) scale(1)} 50%{transform:translate(-260px,-50px) rotate(-6deg) scale(1.15)} }
@keyframes rib-3{ 0%,100%{transform:translate(0,0) rotate(6deg) scale(1.05)} 50%{transform:translate(180px,-70px) rotate(-8deg) scale(1.2)} }
@keyframes rib-4{ 0%,100%{transform:translate(0,0) rotate(-6deg) scale(1)} 50%{transform:translate(-160px,80px) rotate(8deg) scale(1.12)} }

/* centered PRISM hex emblem watermark */
.emblem{ position:absolute; z-index:2; left:50%; top:50%;
  width:380px; height:380px; opacity:0.55; pointer-events:none;
  filter:drop-shadow(0 0 46px rgba(120,150,255,0.30));
  animation:emblem-float 7s ease-in-out infinite; }
.emblem .mark{ position:absolute; inset:0; width:100%; height:100%; }
.emblem .hex-in{ transform-origin:256px 256px; animation:emblem-spin 52s linear infinite reverse; }
.emblem .word{ position:absolute; left:0; right:0; top:50%; transform:translateY(-50%);
  text-align:center; text-indent:14px; font-size:52px; font-weight:700; letter-spacing:14px;
  background:linear-gradient(100deg,var(--c1),var(--c2),#ffffff 45%,var(--c3),var(--c4));
  background-size:250% 100%; -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 22px rgba(140,170,255,0.4)); animation:shimmer 7s linear infinite; }
@keyframes emblem-float{ 0%,100%{transform:translate(-50%,-50%)} 50%{transform:translate(-50%,calc(-50% - 12px))} }
@keyframes emblem-spin{ 100%{transform:rotate(360deg)} }

/* dim the whole thing slightly so overlays always win */
.wall-tint{ position:absolute; inset:0; z-index:3; pointer-events:none; background:rgba(4,5,11,0.10); }

@media (prefers-reduced-motion: reduce){
  .aurora span, .emblem, .emblem .hex-in, .emblem .word{ animation:none !important; }
}
</style>
</head>
<body data-motes="90">
<div class="bg">
  <div class="aurora">
    <span class="a1"></span><span class="a2"></span><span class="a3"></span><span class="a4"></span>
  </div>
  <div class="grid-floor"></div>
  <div class="particles" id="particles"></div>

  <div class="emblem">
    <svg class="mark" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="ir" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#57F2E4"/>
          <stop offset="28%" stop-color="#6C8BFF"/>
          <stop offset="55%" stop-color="#B983FF"/>
          <stop offset="80%" stop-color="#FF7ACb"/>
          <stop offset="100%" stop-color="#FFD86B"/>
        </linearGradient>
      </defs>
      <polygon points="256,24 457,140 457,372 256,488 55,372 55,140"
        fill="none" stroke="url(#ir)" stroke-width="3" stroke-linejoin="round" opacity="0.6"/>
      <polygon class="hex-in" points="256,58 428,157 428,355 256,454 84,355 84,157"
        fill="none" stroke="url(#ir)" stroke-width="2" stroke-dasharray="4 16"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
    </svg>
    <div class="word">PRISM</div>
  </div>

  <div class="vignette"></div>
  <div class="wall-tint"></div>
</div>
<script src="../core/prism-config.js"></script>
<script src="../core/prism-engine.js"></script>
</body>
</html>
