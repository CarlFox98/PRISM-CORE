<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PRISM — Game Scene Wallpaper</title>
<link rel="stylesheet" href="../core/prism-theme.css">
<style>
/* ============================================================
   PRISM — Game Scene Wallpaper
   Full-screen ambient background for the moments before a game
   is captured. Add as a Browser Source (1920x1080) at the
   BOTTOM of your Game Scene's layer stack; the game capture
   covers it automatically once the game is up.
   ============================================================ */

/* flowing aurora ribbons (dynamic) */
.aurora{ position:absolute; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
.aurora span{ position:absolute; border-radius:50%; filter:blur(70px); mix-blend-mode:screen; opacity:0.5; }
.aurora .a1{ width:1400px; height:520px; left:-8%; top:10%;
  background:radial-gradient(ellipse, rgba(87,242,228,0.30), transparent 68%);
  animation:rib-1 30s ease-in-out infinite; }
.aurora .a2{ width:1500px; height:560px; right:-10%; top:34%;
  background:radial-gradient(ellipse, rgba(185,131,255,0.28), transparent 68%);
  animation:rib-2 38s ease-in-out infinite; }
.aurora .a3{ width:1300px; height:480px; left:10%; bottom:-4%;
  background:radial-gradient(ellipse, rgba(255,122,203,0.22), transparent 70%);
  animation:rib-3 34s ease-in-out infinite; }
.aurora .a4{ width:1200px; height:460px; right:6%; top:2%;
  background:radial-gradient(ellipse, rgba(108,139,255,0.24), transparent 70%);
  animation:rib-4 44s ease-in-out infinite; }
@keyframes rib-1{ 0%,100%{transform:translate(0,0) rotate(-8deg) scale(1)} 50%{transform:translate(240px,60px) rotate(6deg) scale(1.18)} }
@keyframes rib-2{ 0%,100%{transform:translate(0,0) rotate(10deg) scale(1)} 50%{transform:translate(-260px,-50px) rotate(-6deg) scale(1.15)} }
@keyframes rib-3{ 0%,100%{transform:translate(0,0) rotate(6deg) scale(1.05)} 50%{transform:translate(180px,-70px) rotate(-8deg) scale(1.2)} }
@keyframes rib-4{ 0%,100%{transform:translate(0,0) rotate(-6deg) scale(1)} 50%{transform:translate(-160px,80px) rotate(8deg) scale(1.12)} }

/* centered PRISM hex emblem watermark */
.emblem{ position:absolute; z-index:2; left:50%; top:50%;
  width:380px; height:380px; opacity:0.55; pointer-events:none;
  filter:drop-shadow(0 0 46px rgba(120,150,255,0.30));
  animation:emblem-float 7s ease-in-out infinite; }
.emblem .mark{ position:absolute; inset:0; width:100%; height:100%; }
.emblem .hex-in{ transform-origin:256px 256px; animation:emblem-spin 52s linear infinite reverse; }
.emblem .word{ position:absolute; left:0; right:0; top:50%; transform:translateY(-50%);
  text-align:center; text-indent:14px; font-size:52px; font-weight:700; letter-spacing:14px;
  background:linear-gradient(100deg,var(--c1),var(--c2),#ffffff 45%,var(--c3),var(--c4));
  background-size:250% 100%; -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 22px rgba(140,170,255,0.4)); animation:shimmer 7s linear infinite; }
@keyframes emblem-float{ 0%,100%{transform:translate(-50%,-50%)} 50%{transform:translate(-50%,calc(-50% - 12px))} }
@keyframes emblem-spin{ 100%{transform:rotate(360deg)} }

/* twinkling starfield (populated by script) */
.starfield{ position:absolute; inset:0; z-index:1; pointer-events:none; }
.starfield .star{ position:absolute; border-radius:50%; background:#fff;
  box-shadow:0 0 6px rgba(180,200,255,0.7); animation:twinkle 3s ease-in-out infinite; }
@keyframes twinkle{ 0%,100%{opacity:0.15; transform:scale(0.7)} 50%{opacity:0.9; transform:scale(1.15)} }

/* slow rotating light-ray sunburst behind the emblem */
.sunburst{ position:absolute; left:50%; top:50%; width:1500px; height:1500px; z-index:1;
  transform:translate(-50%,-50%); pointer-events:none; opacity:0.10; filter:blur(2px);
  background:repeating-conic-gradient(from 0deg, rgba(255,255,255,0.5) 0deg 1.4deg, transparent 1.4deg 13deg);
  -webkit-mask:radial-gradient(circle, #000 0%, rgba(0,0,0,0.5) 34%, transparent 62%);
  mask:radial-gradient(circle, #000 0%, rgba(0,0,0,0.5) 34%, transparent 62%);
  animation:sun-spin 150s linear infinite; }
@keyframes sun-spin{ 100%{transform:translate(-50%,-50%) rotate(360deg)} }

/* parallax star layers (different drift speeds = depth) */
.starlayer{ position:absolute; inset:-6%; z-index:1; pointer-events:none; }
.starlayer.l1{ animation:drift1 90s ease-in-out infinite; }
.starlayer.l2{ animation:drift2 130s ease-in-out infinite; }
.starlayer.l3{ animation:drift3 175s ease-in-out infinite; }
@keyframes drift1{ 0%,100%{transform:translate(0,0)} 50%{transform:translate(28px,-18px)} }
@keyframes drift2{ 0%,100%{transform:translate(0,0)} 50%{transform:translate(-36px,22px)} }
@keyframes drift3{ 0%,100%{transform:translate(0,0)} 50%{transform:translate(20px,30px)} }

/* time-of-day tint (set by script) */
.tod{ position:absolute; inset:0; z-index:1; pointer-events:none; mix-blend-mode:soft-light; opacity:0.5; transition:background 4s ease; }

/* seasonal particles */
.season{ position:absolute; inset:0; z-index:1; pointer-events:none; overflow:hidden; }
.season .p{ position:absolute; top:-6vh; will-change:transform,opacity; animation:fall linear infinite; }
.season .p.dot{ border-radius:50%; background:#fff; box-shadow:0 0 6px rgba(200,220,255,0.8); }
.season .p.glow{ border-radius:50%; background:#FFD86B; box-shadow:0 0 10px rgba(255,216,107,0.9); }
@keyframes fall{ 0%{ transform:translate(0,-6vh) rotate(0); opacity:0 } 12%{ opacity:var(--o,0.6) }
  100%{ transform:translate(var(--drift,20px),112vh) rotate(360deg); opacity:0 } }

/* event ripple + spark shower (fired on stream events) */
.fx-layer{ position:absolute; inset:0; z-index:2; pointer-events:none; overflow:hidden; }
.ripple{ position:absolute; left:50%; top:50%; width:300px; height:300px; border-radius:50%;
  border:2px solid #fff; transform:translate(-50%,-50%) scale(0.2); opacity:0.7;
  animation:ripplego 1.7s cubic-bezier(0.2,0.7,0.2,1) forwards; }
@keyframes ripplego{ to{ transform:translate(-50%,-50%) scale(4.6); opacity:0 } }
.spark{ position:absolute; left:50%; top:50%; width:3px; height:3px; border-radius:50%; background:currentColor;
  box-shadow:0 0 8px currentColor; animation:sparkgo 1.1s ease-out forwards; }
@keyframes sparkgo{ to{ transform:translate(var(--dx),var(--dy)) scale(0.4); opacity:0 } }
.aurora.surge span{ opacity:0.85 !important; transition:opacity 0.4s ease; }

/* community quote (top-left, quiet) */
.wp-quote{ position:absolute; left:56px; top:52px; z-index:4; max-width:560px; pointer-events:none;
  font-size:19px; line-height:1.5; color:#C9D2F0; opacity:0; transform:translateY(6px);
  transition:opacity 0.8s ease, transform 0.8s ease; text-shadow:0 2px 14px rgba(0,0,0,0.65); }
.wp-quote.on{ opacity:0.92; transform:none; }
.wp-quote .q{ color:#fff; } .wp-quote .by{ color:#9fb0da; font-size:14px; }

/* recent wins (bottom-right, quiet) */
.wp-wins{ position:absolute; right:56px; bottom:52px; z-index:4; width:440px; text-align:right; pointer-events:none;
  display:flex; flex-direction:column; gap:6px; }
.wp-wins .w{ font-size:15px; color:#C9D2F0; opacity:0; transform:translateX(14px);
  transition:opacity 0.5s ease, transform 0.5s ease; text-shadow:0 2px 12px rgba(0,0,0,0.65); }
.wp-wins .w.on{ opacity:0.92; transform:none; }
.wp-wins .w b{ color:#fff; font-weight:600; }

/* dim the whole thing slightly so overlays always win */
.wall-tint{ position:absolute; inset:0; z-index:3; pointer-events:none; background:rgba(4,5,11,0.10); }

@media (prefers-reduced-motion: reduce){
  .aurora span, .emblem, .emblem .hex-in, .emblem .word,
  .starfield .star, .sunburst, .starlayer, .season .p, .ripple, .spark{ animation:none !important; }
}
</style>
</head>
<body data-motes="90">
<div class="bg">
  <div class="aurora">
    <span class="a1"></span><span class="a2"></span><span class="a3"></span><span class="a4"></span>
  </div>
  <div class="grid-floor"></div>
  <div class="tod" id="tod"></div>
  <div class="sunburst"></div>
  <div class="starfield" id="starfield"></div>
  <div class="season" id="season"></div>
  <div class="particles" id="particles"></div>
  <div class="fx-layer" id="fx"></div>

  <div class="emblem">
    <svg class="mark" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="ir" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#57F2E4"/>
          <stop offset="28%" stop-color="#6C8BFF"/>
          <stop offset="55%" stop-color="#B983FF"/>
          <stop offset="80%" stop-color="#FF7ACb"/>
          <stop offset="100%" stop-color="#FFD86B"/>
        </linearGradient>
      </defs>
      <polygon points="256,24 457,140 457,372 256,488 55,372 55,140"
        fill="none" stroke="url(#ir)" stroke-width="3" stroke-linejoin="round" opacity="0.6"/>
      <polygon class="hex-in" points="256,58 428,157 428,355 256,454 84,355 84,157"
        fill="none" stroke="url(#ir)" stroke-width="2" stroke-dasharray="4 16"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
    </svg>
    <div class="word">PRISM</div>
  </div>

  <div class="wp-quote" id="wp-quote"></div>
  <div class="wp-wins" id="wp-wins"></div>

  <div class="vignette"></div>
  <div class="wall-tint"></div>
</div>
<script src="../core/prism-config.js"></script>
<script src="../core/prism-engine.js"></script>
<script>
/* Living wallpaper: parallax stars, time-of-day tint, seasonal particles,
   event-reactive bursts (SSE), a recent-wins strip, and community quotes. */
(function () {
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function esc(s){ return String(s==null?'':s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}); }

  // ── parallax starfield (3 drift layers) ──
  var sf = document.getElementById('starfield');
  if (sf) [{n:34,cls:'l1',max:1.6},{n:26,cls:'l2',max:2.2},{n:18,cls:'l3',max:3}].forEach(function(L){
    var layer = document.createElement('div'); layer.className = 'starlayer ' + L.cls;
    for (var i=0;i<L.n;i++){ var s=document.createElement('span'); s.className='star';
      var sz=(Math.random()*(L.max-0.8)+0.8).toFixed(1);
      s.style.cssText='left:'+(Math.random()*100)+'%;top:'+(Math.random()*100)+'%;width:'+sz+'px;height:'+sz+'px;'+
        'animation-duration:'+(2+Math.random()*4).toFixed(1)+'s;animation-delay:'+(Math.random()*4).toFixed(1)+'s;';
      layer.appendChild(s); }
    sf.appendChild(layer);
  });

  // ── time-of-day tint ──
  var tod = document.getElementById('tod');
  function applyTod(){
    if (!tod) return; var h = new Date().getHours(); var g;
    if (h<6)       g='linear-gradient(180deg, rgba(20,24,60,0.9), rgba(8,10,26,0.7))';      // night
    else if (h<9)  g='linear-gradient(180deg, rgba(96,72,120,0.7), rgba(40,60,110,0.5))';   // dawn
    else if (h<17) g='linear-gradient(180deg, rgba(70,90,140,0.5), rgba(50,70,120,0.4))';   // day
    else if (h<20) g='linear-gradient(180deg, rgba(150,84,92,0.6), rgba(90,60,120,0.5))';   // dusk
    else           g='linear-gradient(180deg, rgba(52,40,92,0.8), rgba(16,14,36,0.7))';     // evening
    tod.style.background = g;
  }
  applyTod(); setInterval(applyTod, 300000);

  // ── seasonal particles ──
  var season = document.getElementById('season');
  if (season && !reduce){
    var m = new Date().getMonth();
    var kind = (m===11||m<2)?'snow' : (m<5)?'petal' : (m<8)?'firefly' : 'leaf';
    var glyph = {petal:'🌸', leaf:'🍂'}[kind];
    for (var i=0;i<26;i++){
      var p=document.createElement('div'); p.className='p';
      var big=(kind==='leaf'||kind==='petal'), sz=big?(14+Math.random()*12):(2+Math.random()*3);
      p.style.cssText='left:'+(Math.random()*100)+'%;--drift:'+(((Math.random()*80-40)|0))+'px;--o:'+
        (0.4+Math.random()*0.5).toFixed(2)+';animation-duration:'+(8+Math.random()*10).toFixed(1)+
        's;animation-delay:'+(Math.random()*12).toFixed(1)+'s;';
      if (kind==='snow'){ p.classList.add('dot'); p.style.width=p.style.height=sz+'px'; }
      else if (kind==='firefly'){ p.classList.add('glow'); p.style.width=p.style.height=sz+'px'; }
      else { p.textContent=glyph; p.style.fontSize=sz+'px'; }
      season.appendChild(p);
    }
  }

  // ── event-reactive ambiance + recent wins (SSE) ──
  var fx=document.getElementById('fx'), aurora=document.querySelector('.aurora'), winsBox=document.getElementById('wp-wins');
  var TINT={ wheel:'#B983FF', coinflip:'#57F2E4', slots:'#FFD86B', hype:'#FF7ACB' };
  var winEls=[];
  function pushWin(text){
    if (!winsBox || !text) return;
    var w=document.createElement('div'); w.className='w'; w.innerHTML='<b>'+esc(text)+'</b>';
    winsBox.insertBefore(w, winsBox.firstChild); winEls.unshift(w);
    requestAnimationFrame(function(){ w.classList.add('on'); });
    while (winEls.length>3){ var old=winEls.pop(); old.classList.remove('on'); setTimeout(function(x){return function(){x.remove();};}(old),600); }
    setTimeout(function(){ w.classList.remove('on'); setTimeout(function(){ w.remove(); },600);
      var ix=winEls.indexOf(w); if(ix>=0) winEls.splice(ix,1); }, 14000);
  }
  function react(ev){
    var color=TINT[ev.channel] || '#8CA6FF';
    if (fx && !reduce){
      var r=document.createElement('div'); r.className='ripple'; r.style.borderColor=color; r.style.color=color;
      fx.appendChild(r); setTimeout(function(){ r.remove(); },1800);
      for (var i=0;i<14;i++){ var sp=document.createElement('div'); sp.className='spark'; sp.style.color=color;
        var a=Math.random()*6.283, d=120+Math.random()*220;
        sp.style.setProperty('--dx',(Math.cos(a)*d).toFixed(0)+'px'); sp.style.setProperty('--dy',(Math.sin(a)*d).toFixed(0)+'px');
        fx.appendChild(sp); setTimeout(function(x){return function(){x.remove();};}(sp),1200); }
    }
    if (aurora){ aurora.classList.add('surge'); setTimeout(function(){ aurora.classList.remove('surge'); },1400); }
    if (ev.summary) pushWin(ev.summary);
  }
  fetch('/api/interactive',{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){
    (d.recent||[]).slice(0,2).reverse().forEach(function(it){ if(it.text) pushWin(it.text); });
  }).catch(function(){});
  if (window.EventSource){ try{
    var es=new EventSource('/api/stream');
    es.onmessage=function(e){ var ev; try{ ev=JSON.parse(e.data); }catch(_){ return; } react(ev); };
    es.onerror=function(){};
  }catch(_){} }

  // ── community quote drift ──
  var qEl=document.getElementById('wp-quote'), quotes=[];
  function loadQuotes(){ fetch('/api/quotes',{cache:'no-store'}).then(function(r){return r.json();})
    .then(function(d){ quotes=(d.quotes||[]).filter(function(q){return q.text;}); }).catch(function(){}); }
  function showQuote(){
    if (!qEl || !quotes.length) return;
    var q=quotes[(Math.random()*quotes.length)|0];
    qEl.innerHTML='<span class="q">“'+esc(q.text)+'”</span>'+(q.added_by?' <span class="by">— '+esc(q.added_by)+'</span>':'');
    qEl.classList.add('on'); setTimeout(function(){ qEl.classList.remove('on'); },9000);
  }
  loadQuotes(); setInterval(loadQuotes, 240000);
  setTimeout(function(){ showQuote(); setInterval(showQuote, 25000); }, 3000);
})();
</script>
</body>
</html>
