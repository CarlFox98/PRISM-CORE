<!DOCTYPE html>
<html lang="en" data-anchor="bottom" data-align="left">
<head>
<meta charset="UTF-8">
<title>PRISM Holo — Chat Preview</title>
<link rel="stylesheet" href="../fonts/prism-fonts.css">
<!-- Previews the REAL chat overlay: prism-chat-base.css for structure plus
     holo's skin for the look, drawn with the same .pc-* DOM
     core/prism-chat.js builds. What this page shows is what ships.
     The skin is referenced by its source name; the set build renames it to
     chat-theme.css (see the FLATTEN rule in scripts/build-obs-set.py).
     (History: docs/CHANGELOG.md 2.2.2. Deliberately no mention of the retired
     sheet's name here — scripts/test-socials.mjs greps for it, and a guard
     that matches its own explanation catches nothing.) -->
<link rel="stylesheet" href="../core/prism-chat-base.css">
<link rel="stylesheet" href="../widgets/theme-holo-chat.css">
<style>
/* Preview stage only — none of this ships with the overlay. prism-theme.css
   carries no stage chrome, so unlike the 2.0 sets the backdrop is defined
   here. prism-chat-base.css makes html/body transparent and full-height for
   OBS, which is why this block comes after it. */
html,body{
  background:
    radial-gradient(900px 600px at 18% 12%, rgba(155,231,255,.16), transparent 60%),
    radial-gradient(800px 560px at 82% 78%, rgba(255,179,230,.14), transparent 62%),
    #0A0E1A !important;
  height:100%; overflow:hidden;
  font-family:'Space Grotesk', system-ui, sans-serif;
}
.cap{ position:absolute; left:60px; top:60px; width:780px;
      display:flex; flex-direction:column; gap:14px; align-items:flex-start; z-index:3; }
.label{
  font-size:15px; letter-spacing:.22em; text-transform:uppercase;
  color:#9BE7FF; padding:8px 16px; border-radius:999px;
  border:1px solid rgba(155,231,255,.28); background:rgba(155,231,255,.08);
}
.lede{ font-size:22px; line-height:1.5; color:rgba(240,246,255,.82); }
.lede b{ color:#fff; font-weight:600; }
.shell{ position:absolute; right:60px; top:60px; bottom:60px; width:520px; z-index:3; }
#pc-feed{ height:100%; }
</style>
</head>
<body>
  <div class="cap">
    <div class="label">Chat preview · Holo</div>
    <div class="lede">The live overlay is <b>chat/prism-chat.html</b>, deployed with
      <b>scripts/deploy-chat.py</b> and added to OBS as
      <b>http://localhost:5000/static/chat/chat.html</b>. It restyles itself from
      the active set's <b>chat-theme.css</b> within 60s of a set switch.</div>
  </div>
  <div class="shell"><div id="pc-feed" role="log" aria-label="Chat preview"></div></div>
<script>window.PRISM_CHATDEMO = { colors:['#9BE7FF','#B9A7FF','#FFB3E6','#A7FFE1','#FFE6A7'] };</script>
<script src="../core/prism-chat-demo.js"></script>
</body>
</html>
