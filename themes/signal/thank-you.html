<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PRISM Signal — Thank You</title>
<link rel="stylesheet" href="signal.css">
<style>
html,body{ background:transparent; }
.ty{ position:absolute; left:50%; top:50%; width:960px; transform:translate(-50%,-44%); opacity:0;
  transition:opacity .45s, transform .6s cubic-bezier(.16,1,.3,1); }
.ty.show{ opacity:1; transform:translate(-50%,-50%); }
.ty .head{ display:flex; justify-content:space-between; padding:12px 28px; background:var(--mg); color:#04090D;
  font-family:var(--mono); font-size:22px; font-weight:600; letter-spacing:4px;
  clip-path:polygon(0 0,calc(100% - 22px) 0,100% 100%,0 100%); width:70%; }
.ty .body{ background:rgba(6,20,24,0.94); border:1px solid rgba(255,95,162,0.6); padding:34px 40px 40px;
  clip-path:polygon(0 0,100% 0,100% calc(100% - 28px),calc(100% - 28px) 100%,0 100%); }
.ty .name{ font-size:110px; font-weight:700; line-height:1; letter-spacing:2px; text-transform:uppercase; overflow-wrap:anywhere; }
.ty .msg{ margin-top:18px; font-family:var(--mono); font-size:26px; color:var(--soft); }
.ty .msg::before{ content:"> "; color:var(--cy); }
#bar{ position:fixed; left:50%; bottom:40px; transform:translateX(-50%); display:flex; align-items:center; gap:18px;
  padding:12px 18px; background:rgba(6,20,24,0.94); border:1px solid var(--line); font-family:var(--mono); font-size:18px; color:var(--dim); }
#bar button{ cursor:pointer; padding:10px 18px; background:var(--cy); color:#04090D; border:0; font-weight:600; letter-spacing:2px; }
#note{ position:fixed; left:50%; top:30px; transform:translateX(-50%); padding:8px 16px; background:rgba(6,20,24,0.94);
  border:1px solid var(--am); color:var(--am); font-family:var(--mono); font-size:18px; }
.hidden{ display:none !important; }
</style>
</head>
<body>
<div class="ty" id="card" role="status">
  <div class="head"><span>NEW SIGNAL // FOLLOW</span><span>+1</span></div>
  <div class="body">
    <div class="name" id="name">Follower</div>
    <div class="msg" id="msg"></div>
  </div>
</div>
<div id="note" class="hidden"></div>
<div id="bar" class="hidden"><button id="pick">Thank a follower</button><span>or Space · ?hidebar hides this · ?auto picks on load</span></div>
<script>window.PRISM_THANKYOU = { messages:[
  "Welcome aboard — glad you're here.",
  "Signal received. Enjoy the stream!",
  "Thanks for the follow — see you in chat.",
  "You just boosted the signal. Thank you!"
]};</script>
<script src="../../core/prism-config.js"></script>
<script src="../../core/prism-thankyou.js"></script>
</body>
</html>
