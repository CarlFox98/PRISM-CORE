<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PRISM Signal — Wallpaper</title>
<link rel="stylesheet" href="signal.css">
<style>
/* the one moving thing: a slow radar sweep */
.radar{ left:50%; top:50%; width:760px; height:760px; margin:-380px 0 0 -380px; border-radius:50%;
  border:1px solid rgba(92,242,227,0.25); }
.radar::before,.radar::after{ content:""; position:absolute; border-radius:50%; border:1px solid rgba(92,242,227,0.16); }
.radar::before{ inset:120px; } .radar::after{ inset:250px; }
.radar .beam{ position:absolute; inset:0; border-radius:50%;
  background:conic-gradient(from 0deg,rgba(92,242,227,0.28),transparent 22%);
  animation:spin 12s linear infinite; }
.radar .x{ position:absolute; left:50%; top:0; bottom:0; width:1px; background:rgba(92,242,227,0.16); }
.radar .y{ position:absolute; top:50%; left:0; right:0; height:1px; background:rgba(92,242,227,0.16); }
@keyframes spin{ to{ transform:rotate(360deg); } }
.mark{ left:0; right:0; top:50%; margin-top:-60px; text-align:center; font-size:120px; font-weight:700; letter-spacing:24px;
  color:rgba(221,247,244,0.12); text-transform:uppercase; }
.surge{ } .radar.surge{ border-color:var(--mg); box-shadow:0 0 60px rgba(255,95,162,0.3); transition:box-shadow .3s; }
#wp-wins{ left:140px; bottom:160px; width:720px; display:flex; flex-direction:column; gap:10px; }
#wp-wins .w{ font-family:var(--mono); font-size:24px; color:var(--soft); opacity:0; transform:translateX(-20px); transition:all .5s; }
#wp-wins .w::before{ content:"> "; color:var(--cy); }
#wp-wins .w.on{ opacity:1; transform:none; }
#wp-wins .w b{ font-weight:400; }
#wp-quote{ right:140px; bottom:160px; width:640px; opacity:0; transition:opacity .8s; }
#wp-quote.on{ opacity:1; }
#wp-quote .q{ font-size:34px; font-weight:500; color:var(--ink); line-height:1.3; }
#wp-quote .by{ display:block; margin-top:10px; font-family:var(--mono); font-size:22px; color:var(--dim); }
#fx{ inset:0; pointer-events:none; z-index:4; }
.ripple{ position:absolute; left:50%; top:50%; width:40px; height:40px; margin:-20px 0 0 -20px; border:2px solid; border-radius:50%;
  animation:ripple 1.8s ease-out forwards; }
@keyframes ripple{ to{ transform:scale(24); opacity:0; } }
.spark{ position:absolute; left:50%; top:50%; width:6px; height:6px; background:currentColor; box-shadow:0 0 10px currentColor;
  animation:spark 1.2s ease-out forwards; }
@keyframes spark{ to{ transform:translate(var(--dx),var(--dy)); opacity:0; } }
/* time-of-day tint */
.tint{ inset:0; z-index:1; pointer-events:none; transition:background 3s; }
body[data-tod="dawn"] .tint{ background:rgba(255,200,87,0.05); }
body[data-tod="dusk"] .tint{ background:rgba(255,95,162,0.06); }
body[data-tod="night"] .tint,body[data-tod="evening"] .tint{ background:rgba(0,0,0,0.18); }
@media (prefers-reduced-motion: reduce){ .radar .beam{ animation:none; } }
</style>
</head>
<body>
<div class="stage">
  <div class="tint"></div>
  <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
  <div class="radar js-surge"><div class="beam"></div><div class="x"></div><div class="y"></div></div>
  <div class="mark js-name">NeoTheFox98</div>
  <div class="bar-top"><span>PRISM//SIGNAL</span><span class="state cy">Idle</span></div>
  <div id="wp-wins"></div>
  <div id="wp-quote"></div>
  <div id="fx"></div>
  <div class="bar-bot"><span>twitch.tv/<span class="js-name">NeoTheFox98</span></span><span>Scanning</span></div>
</div>
<script>window.PRISM_WALLPAPER = { tint:{ wheel:'#FF5FA2', coinflip:'#5CF2E3', slots:'#FFC857', hype:'#FF5FA2' }, fallbackTint:'#5CF2E3' };</script>
<script src="../../core/prism-config.js"></script>
<script src="../../core/prism-engine.js"></script>
<script src="../../core/prism-wallpaper.js"></script>
</body>
</html>
