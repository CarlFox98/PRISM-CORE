<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PRISM Soft Holo — Be Right Back</title>
<link rel="stylesheet" href="soft.css">
<style>
.who{ left:170px; top:250px; display:flex; flex-direction:column; align-items:center; }

.who .sticker{ margin-top:-40px; font-size:40px; padding:14px 34px; }
.main{ left:720px; top:200px; right:150px; display:flex; flex-direction:column; gap:26px; align-items:flex-start; }
.main .title{ font-size:170px; }
.foot{ left:150px; right:150px; bottom:90px; display:flex; align-items:center; justify-content:space-between; }
</style>
</head>
<body>
<div class="stage">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <div class="paw" style="left:150px;top:120px;transform:rotate(-14deg)"><svg width="120" height="120" viewBox="0 0 64 64" aria-hidden="true"><ellipse cx="14" cy="26" rx="7" ry="9"/><ellipse cx="26" cy="14" rx="7" ry="9"/><ellipse cx="40" cy="14" rx="7" ry="9"/><ellipse cx="52" cy="26" rx="7" ry="9"/><path d="M32 30c-10 0-18 10-18 18 0 7 6 10 12 8 3-1 4-2 6-2s3 1 6 2c6 2 12-1 12-8 0-8-8-18-18-18z"/></svg></div>
  <div class="paw" style="right:170px;top:600px;transform:rotate(18deg);opacity:.1"><svg width="90" height="90" viewBox="0 0 64 64" aria-hidden="true"><ellipse cx="14" cy="26" rx="7" ry="9"/><ellipse cx="26" cy="14" rx="7" ry="9"/><ellipse cx="40" cy="14" rx="7" ry="9"/><ellipse cx="52" cy="26" rx="7" ry="9"/><path d="M32 30c-10 0-18 10-18 18 0 7 6 10 12 8 3-1 4-2 6-2s3 1 6 2c6 2 12-1 12-8 0-8-8-18-18-18z"/></svg></div>
  <div class="who pop">
    <div class="avatar"><img class="js-avatar" alt="NeoTheFox98"></div>
    <div class="sticker tilt-r">brb!</div>
  </div>
  <div class="main">
    <div class="tag pink tilt-l pop d1">grabbing a drink — don't go anywhere</div>
    <div class="title pop d2">Be right back</div>
    <div class="lede pop d3 js-game-wrap" hidden>Still playing <b class="js-game"></b></div>
    <div class="card pop d4 js-latest-wrap" hidden><span class="label">newest in the pack</span><div style="font-family:var(--display);font-size:48px;font-weight:800;margin-top:4px" class="js-latest"></div></div>
  </div>
  <div class="foot pop d5"><div class="socials" data-prism-socials></div><div class="sticker tilt-r"><span>twitch.tv/<span class="js-name">NeoTheFox98</span></span></div></div>
</div>
