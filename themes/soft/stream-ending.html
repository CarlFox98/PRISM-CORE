<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PRISM Soft Holo — Stream Ending</title>
<link rel="stylesheet" href="soft.css">
<style>
.main{ left:150px; top:170px; right:150px; display:flex; flex-direction:column; gap:22px; align-items:flex-start; }
.main .title{ font-size:160px; }
.row{ left:150px; top:640px; display:flex; gap:30px; align-items:stretch; }
.row .card{ min-width:340px; }
.big{ font-family:var(--display); font-size:96px; font-weight:800; line-height:1; margin-top:6px; }
.who{ right:170px; top:170px; }
.who .avatar{ width:300px; height:300px; }
.foot{ left:150px; right:150px; bottom:90px; display:flex; align-items:center; justify-content:space-between; }
</style>
</head>
<body>
<div class="stage">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <div class="paw" style="left:150px;top:120px;transform:rotate(-14deg)"><svg width="120" height="120" viewBox="0 0 64 64" aria-hidden="true"><ellipse cx="14" cy="26" rx="7" ry="9"/><ellipse cx="26" cy="14" rx="7" ry="9"/><ellipse cx="40" cy="14" rx="7" ry="9"/><ellipse cx="52" cy="26" rx="7" ry="9"/><path d="M32 30c-10 0-18 10-18 18 0 7 6 10 12 8 3-1 4-2 6-2s3 1 6 2c6 2 12-1 12-8 0-8-8-18-18-18z"/></svg></div>
  <div class="paw" style="right:170px;top:600px;transform:rotate(18deg);opacity:.1"><svg width="90" height="90" viewBox="0 0 64 64" aria-hidden="true"><ellipse cx="14" cy="26" rx="7" ry="9"/><ellipse cx="26" cy="14" rx="7" ry="9"/><ellipse cx="40" cy="14" rx="7" ry="9"/><ellipse cx="52" cy="26" rx="7" ry="9"/><path d="M32 30c-10 0-18 10-18 18 0 7 6 10 12 8 3-1 4-2 6-2s3 1 6 2c6 2 12-1 12-8 0-8-8-18-18-18z"/></svg></div>
  <div class="main">
    <div class="tag butter tilt-l pop">that's a wrap!</div>
    <div class="title pop d1">Thanks for<br>hanging out!</div>
  </div>
  <div class="who pop d2"><div class="avatar"><img class="js-avatar" alt="NeoTheFox98"></div></div>
  <div class="row">
    <div class="card pop d3"><span class="label">followers</span><div class="big js-followcount">—</div></div>
    <div class="card cream tilt-s pop d4 js-latest-wrap" hidden><span class="label" style="color:#6B5A8E">newest in the pack</span><div class="big js-latest" style="font-size:72px"></div></div>
  </div>
  <div class="foot pop d5"><div class="socials" data-prism-socials></div><div class="sticker tilt-r">see you next time!</div></div>
</div>
<script src="../../core/prism-config.js"></script>
<script src="../../core/prism-engine.js"></script>
</body></html>
