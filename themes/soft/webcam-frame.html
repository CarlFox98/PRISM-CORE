<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PRISM Soft Holo — Webcam Frame</title>
<link rel="stylesheet" href="soft.css">
<style>
/* Size the OBS browser source to your camera; the frame follows it. */
html,body{ width:100%; height:100%; background:transparent; }
.cam{ position:fixed; inset:10px 14px 26px 10px; border-radius:30px; padding:7px; background:var(--iris);
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite:xor; mask-composite:exclude; }
.shadow{ position:fixed; inset:10px 14px 26px 10px; border-radius:30px; box-shadow:8px 8px 0 var(--shadow); pointer-events:none; }
.name{ position:fixed; left:34px; bottom:4px; }
.pawtag{ position:fixed; right:30px; top:0; width:58px; height:58px; border-radius:50%; background:var(--ink); color:#FF8FB0;
  display:flex; align-items:center; justify-content:center; box-shadow:5px 5px 0 var(--shadow); }
.pawtag svg{ fill:currentColor; }
body.demo{ background:#150d27; }
</style>
</head>
<body>
<div class="shadow"></div>
<div class="cam"></div>
<div class="name sticker tilt-l"><span class="js-name">NeoTheFox98</span></div>
<div class="pawtag"><svg width="32" height="32" viewBox="0 0 64 64" aria-hidden="true"><ellipse cx="14" cy="26" rx="7" ry="9"/><ellipse cx="26" cy="14" rx="7" ry="9"/><ellipse cx="40" cy="14" rx="7" ry="9"/><ellipse cx="52" cy="26" rx="7" ry="9"/><path d="M32 30c-10 0-18 10-18 18 0 7 6 10 12 8 3-1 4-2 6-2s3 1 6 2c6 2 12-1 12-8 0-8-8-18-18-18z"/></svg></div>
<script src="../../core/prism-config.js"></script>
<script src="../../core/prism-engine.js"></script>
<script>if(new URLSearchParams(location.search).has('demo')) document.body.classList.add('demo');</script>
</body>
</html>
